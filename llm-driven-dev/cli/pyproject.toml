[tool.poetry]
name = "mfe-cli"
version = "0.1.0"
description = "CLI tool for MFE framework development"
authors = []
packages = [{ include = "mfe_cli", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.15.0"
rich = "^13.9.0"
jinja2 = "^3.1.0"

[tool.poetry.scripts]
mfe = "mfe_cli.main:app"

[tool.poetry.group.dev.dependencies]
mypy = "^1.14.0"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
