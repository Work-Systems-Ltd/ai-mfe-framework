server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and app requests to shell backend
    location /api/ {
        proxy_pass http://shell-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internal/ {
        proxy_pass http://shell-backend:8000;
        proxy_set_header Host $host;
    }

    location /apps/ {
        proxy_pass http://shell-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
